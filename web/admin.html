<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Account</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/admin.css">
<script type="module" src="/static/admin.js"></script>
</head>
<body>
<header class="top"></header>
<main>
  <!-- admin -->
  <div id="adminView" hidden>
    <div class="tiles" id="stats"></div>

    <h2 class="section">People <span class="count" id="userCount">0</span></h2>
    <div class="tablewrap">
      <table class="users">
        <thead><tr><th>Name</th><th class="hide-sm">Uploads / clips</th><th>Storage</th><th class="hide-sm">Last sign-in</th><th><span class="sr">Actions</span></th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>

    <div class="twin">
      <section class="panel">
        <h2>Add someone</h2>
        <form id="addForm">
          <div class="fields">
            <div><label for="newName">Name</label><input type="text" id="newName" maxlength="40" required></div>
            <div><label for="newQuota">Storage limit (GB)</label><input type="number" id="newQuota" min="0" step="1"></div>
            <div class="wide"><label for="newPw">Password</label><input type="text" id="newPw" autocomplete="off" placeholder="generated if empty"></div>
          </div>
          <button class="primary" type="submit">Create</button>
        </form>
        <div id="newResult"></div>
      </section>

      <section class="panel">
        <h2>Invite links <span class="count" id="inviteCount">0</span></h2>
        <form id="inviteForm">
          <div class="fields">
            <div><label for="invQuota">Storage limit (GB)</label><input type="number" id="invQuota" min="0" step="1"></div>
            <div><label for="invNote">Note</label><input type="text" id="invNote" maxlength="100" placeholder="e.g. for Sam"></div>
          </div>
          <button class="primary" type="submit">Create invite link</button>
        </form>
        <div id="inviteResult"></div>
        <table class="invites"><tbody id="invites"></tbody></table>
      </section>
    </div>
  </div>

  <!-- everyone else -->
  <div id="selfView" class="selfview" hidden>
    <section class="panel me" id="meCard"></section>
    <section class="panel">
      <h2>Change password</h2>
      <form id="pwForm">
        <input type="text" autocomplete="username" id="pwUser" hidden>
        <label for="curPw">Current password</label><input type="password" id="curPw" autocomplete="current-password" required>
        <label for="newPw1">New password</label><input type="password" id="newPw1" autocomplete="new-password" minlength="8" maxlength="200" placeholder="At least 8 characters" required>
        <label for="newPw2">Repeat new password</label><input type="password" id="newPw2" autocomplete="new-password" minlength="8" maxlength="200" required>
        <button class="primary" type="submit">Change</button>
      </form>
    </section>
  </div>
</main>
</body>
</html>
