<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Clips</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/library.css">
<script type="module" src="/static/library.js"></script>
</head>
<body>
<header class="top" hidden></header>

<main id="login" hidden>
  <div class="login">
    <img class="logo" src="/static/favicon.svg" alt="">
    <h1 id="loginTitle">Clips</h1>
    <form class="panel" id="loginForm">
      <label for="name">Name</label>
      <input type="text" id="name" autocomplete="username" maxlength="40" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="err" id="loginError" role="alert" hidden></div>
      <button class="primary big" type="submit">Sign in</button>
    </form>
    <p class="foot">No account? Ask for an invite link.</p>
  </div>
</main>

<main id="app" hidden>
  <input type="file" id="file" accept="video/*,.mkv,.flv,.ts,.mts,.m2ts" multiple hidden>
  <div class="dropveil" id="dropveil" hidden>
    <div class="dropveil-in">
      <span class="orb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span>
      <strong>Drop to upload</strong>
    </div>
  </div>

  <div class="toolbar">
    <button class="primary big" id="uploadBtn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>Upload</button>
    <div id="usage" class="usage"></div>
    <span class="grow"></span>
    <label class="inline" id="ownerFilterWrap" hidden>Show <select id="ownerFilter" style="width:auto"></select></label>
  </div>

  <div class="uploads" id="uploads"></div>

  <div class="bigdrop" id="bigEmpty" hidden>
    <span class="orb"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span>
    <strong>Drop a recording here</strong>
    <button class="primary big" id="emptyUpload" type="button">Upload</button>
  </div>

  <div id="lists">
    <h2 class="section">Clips <span class="count" id="clipCount">0</span></h2>
    <div class="grid" id="clips"><div class="empty">Loading…</div></div>

    <h2 class="section">Recordings <span class="count" id="recCount">0</span></h2>
    <div class="recs" id="sources"></div>
    <p class="retention" id="retention" hidden></p>
  </div>
</main>
</body>
</html>
